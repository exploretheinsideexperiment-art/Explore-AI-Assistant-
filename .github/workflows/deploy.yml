name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build production bundle
        run: npm run build

      - name: Ensure .nojekyll and 404 exist in dist
        run: |
          touch ./dist/.nojekyll
          cp ./public/404.html ./dist/404.html 2>/dev/null || true

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Actions Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to gh-pages branch (for branch-based hosting)
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false

      - name: Sync all files and build artifacts to GitHub at once
        continue-on-error: true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add -A
          if ! git diff --cached --quiet; then
            echo "Changes detected, committing and pushing all updates at once..."
            git commit -m "chore: sync all updates and build artifacts [skip ci]"
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            git fetch origin "$BRANCH_NAME" || true
            git rebase "origin/$BRANCH_NAME" || true
            git push origin "HEAD:$BRANCH_NAME" || echo "Push completed or skipped"
          else
            echo "Working tree clean, all files already in sync."
          fi


