name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Install dependencies
        run: npm install
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Ensure 404 and nojekyll in dist
        run: |
          touch ./dist/.nojekyll
          cp ./public/404.html ./dist/404.html || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Actions Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Deploy to gh-pages branch (Backup for branch-based hosting)
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
      - name: Auto-commit docs to main branch
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update docs production build [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi

