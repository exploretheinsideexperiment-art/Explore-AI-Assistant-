version: '3.8'

services:
  explore-ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: explore-ai-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SEARCH_API_KEY=${SEARCH_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - explore-net

networks:
  explore-net:
    driver: bridge
