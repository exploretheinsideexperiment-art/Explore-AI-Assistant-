<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Explore AI Assistant</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404s back to root index.html or docs/index.html with query/hash intact
      (function() {
        var l = window.location;
        
        // Never attempt SPA redirection on static asset requests (scripts, styles, images, binary firmware, etc.)
        if (/\.(js|mjs|cjs|css|png|jpg|jpeg|gif|svg|ico|wasm|bin|json|map|woff|woff2|ttf|otf)$/i.test(l.pathname)) {
          return;
        }

        var isGitHubIo = l.hostname.endsWith('.github.io');
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var segmentCount = 1; // 1 segment for user.github.io/repo-name/
        
        var isUserRootPage = isGitHubIo && pathSegments.length > 0 && pathSegments[0] === l.hostname.split('.')[0];
        if (!isGitHubIo || isUserRootPage) {
          segmentCount = 0;
        }
        
        // Detect if the app is being hosted inside a /docs/ subdirectory
        var inDocs = pathSegments.length > segmentCount && pathSegments[segmentCount] === 'docs';
        if (inDocs) {
          segmentCount += 1;
        }
        
        var basePath = '/' + pathSegments.slice(0, segmentCount).join('/');
        if (!basePath.endsWith('/')) basePath += '/';
        var restOfPath = pathSegments.slice(segmentCount).join('/');
        
        var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + basePath +
          '?p=/' + encodeURIComponent(restOfPath) +
          (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
          l.hash;
        
        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body style="background:#020617;color:#94a3b8;font-family:sans-serif;padding:2rem;text-align:center;">
    <p>Redirecting to Explore AI Assistant...</p>
  </body>
</html>
