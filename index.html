    <script>
      // 1. GitHub Pages Trailing-Slash Enforcer:
      // Prevents 404 errors when resolving relative assets like ./assets/...
      (function() {
        try {
          var l = window.location;
          if (l.hostname.endsWith('github.io') && !l.pathname.endsWith('/') && !l.pathname.split('/').pop().includes('.')) {
            window.location.replace(l.protocol + '//' + l.host + l.pathname + '/' + l.search + l.hash);
          }
          // 2. Decode 404 SPA redirect parameters into application hash route:
          if (l.search && l.search.includes('p=')) {
            var params = new URLSearchParams(l.search);
            var p = params.get('p');
            if (p) {
              var cleanRoute = p.replace(/^\//, '').replace(/\/$/, '');
              if (cleanRoute) {
                l.hash = cleanRoute;
              }
              window.history.replaceState(null, '', l.pathname + l.hash);
            }
          }
        } catch (e) {
          console.warn('Navigation normalizer error:', e);
        }
      })();
    </script>
